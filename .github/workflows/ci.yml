name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [website, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_DASHBOARD_URL=https://dashboard.example.com
            PUBLIC_GOOGLE_CALENDAR_ID=placeholder@group.calendar.google.com
            VITE_APP_TITLE=IEEE at UC San Diego Dashboard
            VITE_AUTH_BRIDGE_MODE=legacy
            VITE_CONVEX_URL=https://convex.example.com
            VITE_LOGTO_ENDPOINT=https://logto.example.com
            VITE_LOGTO_APP_ID=placeholder
            VITE_LOGTO_REDIRECT_URI=https://dashboard.example.com/callback
            VITE_LOGTO_SCOPES=openid profile email
            VITE_LOGTO_DIRECT_SIGN_IN_TARGET=google
            VITE_GOOGLE_MAPS_API_KEY=placeholder
