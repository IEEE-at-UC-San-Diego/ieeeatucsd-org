# Deploy to Production Environment
# This workflow deploys the application to production when a version tag is pushed
# or when manually triggered with confirmation

name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'apps/dashboard/**'
      - '.github/workflows/deploy-prod.yml'
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch:
    # Manual trigger with confirmation
    inputs:
      confirm_deploy:
        description: 'Confirm production deployment (type "DEPLOY")'
        required: true
        type: string

# Prevent multiple simultaneous deployments - critical for production
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Pre-deployment check job
  pre-deploy-check:
    name: Pre-deployment Verification
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check deployment authorization
        id: check
        run: |
          # If triggered by tag, allow deployment
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deployment triggered by tag: ${{ github.ref_name }}"
          # If manual trigger, check confirmation
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.confirm_deploy }}" == "DEPLOY" ]]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "✅ Manual deployment confirmed"
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "❌ Manual deployment not confirmed. Type 'DEPLOY' to confirm."
              exit 1
            fi
          # If push to main without tag, skip deployment
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Push to main without tag - skipping automatic production deployment"
            echo "Create a version tag (e.g., v1.0.0) to trigger production deployment"
          fi

  deploy-prod:
    name: Deploy to Production
    needs: pre-deploy-check
    if: needs.pre-deploy-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ./apps/dashboard

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for release notes

      # Step 2: Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Cache Bun dependencies
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            apps/dashboard/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/dashboard/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Step 5: Run all quality checks
      - name: Run checks and tests
        run: |
          bun run check
          bunx tsc --noEmit
          bun run test

      # Step 6: Build the application for production
      - name: Build application
        run: bun run build
        env:
          # Production environment variables
          # CRITICAL: These must be configured as GitHub Secrets for production
          NODE_ENV: production
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_LOGTO_ENDPOINT: ${{ secrets.VITE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ secrets.VITE_LOGTO_APP_ID }}

      # Step 7: Deploy to production environment
      # NOTE: This is a placeholder step. Replace with actual deployment provider:
      # - For Vercel: use `vercel --prod` or `vercel-deploy` action
      # - For Netlify: use `netlify deploy --prod` or `netlify/actions`
      # - For AWS: use `aws-actions/configure-aws-credentials` + S3/CloudFront/ECS
      # - For Cloudflare Pages: use `cloudflare/pages-action` with production branch
      # - For Railway: use `railway up --environment production`
      # - For Fly.io: use `fly deploy --remote-only`
      # - For Google Cloud: use `google-github-actions/deploy-appengine`
      - name: Deploy to production
        id: deploy
        run: |
          echo "🚀 Deploying to PRODUCTION environment..."
          echo "Version: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Build output location: ./dist"
          echo ""
          echo "⚠️  PRODUCTION DEPLOYMENT - Ensure all checks passed"
          echo ""
          echo "TODO: Configure your production deployment provider"
          echo "Recommended options for TanStack Start:"
          echo "  - Vercel: vercel --prod --confirm"
          echo "  - Netlify: netlify deploy --prod --dir=dist"
          echo "  - AWS: aws s3 sync dist s3://prod-bucket --delete"
          echo "  - Cloudflare: npx wrangler pages deploy dist --branch=main"
          echo ""
          echo "url=https://your-app.example.com" >> $GITHUB_OUTPUT
          echo "✅ Production deployment placeholder complete. Replace with actual commands."

      # Step 8: Create release notes (for tag-based deployments)
      - name: Create release notes
        if: github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `Production deployment of ${tag}`,
              draft: false,
              prerelease: false
            });

      # Step 9: Notify deployment status
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ PRODUCTION deployment successful!"
          echo "Version: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ PRODUCTION deployment failed!"
          echo "Version: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs above immediately."
